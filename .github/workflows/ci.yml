name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo run -- export-crds > /tmp/database.runvibe.dev.yaml
      - run: diff -u deploy/crds/database.runvibe.dev.yaml /tmp/database.runvibe.dev.yaml
      - run: helm version
      - run: helm lint charts/cloudvibe-database-operator
