apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudvibe-database-operator
  namespace: cloudvibe-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudvibe-database-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudvibe-database-operator
    spec:
      serviceAccountName: cloudvibe-database-operator
      containers:
        - name: manager
          image: ghcr.io/cloudvibedev/cloudvibe-database-operator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HTTP_ADDR
              value: 0.0.0.0:8080
            - name: RUST_LOG
              value: info
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
