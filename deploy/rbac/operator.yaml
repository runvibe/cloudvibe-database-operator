apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudvibe-database-operator
  namespace: cloudvibe-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudvibe-database-operator
rules:
  - apiGroups: ["database.runvibe.dev"]
    resources: ["databaseinstances", "databaseaccesses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["database.runvibe.dev"]
    resources: ["databaseaccesses/status", "databaseinstances/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudvibe-database-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudvibe-database-operator
subjects:
  - kind: ServiceAccount
    name: cloudvibe-database-operator
    namespace: cloudvibe-system
